# nginx do site na demonstração com Docker.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Chamadas "/api/..." vão para a API (mesmo papel do proxy do Vite em desenvolvimento)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  # Rotas do React (/participar, /validar/...) sempre abrem o index.html
  location / {
    try_files $uri /index.html;
  }
}
